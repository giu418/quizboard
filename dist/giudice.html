<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b142b">
  <title data-i18n>Scheda del giudice · Quizboard</title>
  <link rel="stylesheet" href="party.css?v=list-timer">
  <link rel="stylesheet" href="language.css">
  <script src="english-text.js?v=list-timer" defer></script>
  <script src="english-content.js" defer></script>
  <script src="language.js?v=italian-default" defer></script>
  <script src="party-data.js?v=list-timer" defer></script>
  <script src="judge.js?v=list-timer" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Quizboard
      </div>
      <button type="button" class="language-toggle" data-language-toggle lang="en" aria-label="Switch to English" hidden>EN</button>
    </div>
  </header>
  <main class="wrap">
    <section class="panel stage judge-panel tone-proverbs" aria-labelledby="judge-title">
      <div class="stage-header">
        <div>
          <p data-i18n class="kicker">Solo per chi giudica</p>
          <h1 data-i18n id="judge-title">Scheda del giudice</h1>
        </div>
        <span class="round-icon" aria-hidden="true">❞</span>
      </div>
      <p class="stage-copy" id="judge-status" role="status"></p>
      <div class="prompt-card" id="judge-card" hidden>
        <p class="prompt-note" id="judge-position"></p>
        <p class="prompt" id="judge-answer" aria-live="polite"></p>
      </div>
      <p id="judge-note" data-i18n class="stage-copy judge-note" hidden>Per segnare una risposta corretta o un errore, usa i pulsanti nella finestra di gioco.</p>
      <section id="judge-list" aria-labelledby="judge-list-title" hidden>
        <h2 id="judge-list-title" class="panel-title list-category"></h2>
        <p data-i18n class="panel-note">Seleziona la risposta data dalla squadra.</p>
        <div id="judge-list-answers" class="list-answers"></div>
      </section>
    </section>
  </main>
</body>
</html>
