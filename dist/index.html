<!doctype html>
<html lang="it">
<head>

  <title data-i18n>Serata giochi · Quizboard</title>
  <link rel="stylesheet" href="party.css?v=judgment-correction">

  <script src="english-text.js?v=judgment-correction" defer></script>
  <script src="english-content.js?v=photos" defer></script>
  <script src="language.js?v=italian-default" defer></script>
  <script src="mintaka.js" defer></script>

<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./index.html">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Quizboard
      </a>
      <nav aria-label="Modalità di gioco" data-i18n-attrs="aria-label">
        <a class="button secondary display-link" id="display-link" href="./schermo.html" target="quizboard-player" data-i18n>Apri schermo giocatori</a>

  </footer>
  <dialog id="card-dialog" aria-labelledby="card-title"></dialog>
  <p id="live" class="sr-only" role="status"></p>
