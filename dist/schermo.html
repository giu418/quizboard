<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d040f">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Schermo giocatori · Quizboard</title>
  <link rel="stylesheet" href="ui.css?v=due-schermi">
  <link rel="stylesheet" href="theme.css?v=due-schermi">
  <script src="presentation.js" defer></script>
  <script src="player.js?v=due-schermi" defer></script>
  <script src="sound.js?v=due-schermi" defer></script>
</head>
<body class="player-display">
  <header class="player-toolbar">
    <button id="player-fullscreen" class="button ghost" type="button">Schermo intero</button>
    <p id="player-fullscreen-status" class="panel-note" role="status" hidden></p>
  </header>
  <main id="player-stage" class="stage play-stage player-stage tone-quiz">
    <div id="player-heading" class="player-heading" hidden></div>
    <div class="player-body">
      <div id="player-content" class="play-content"></div>
      <video id="player-video" class="song-player" aria-label="Video karaoke" muted playsinline preload="metadata" hidden></video>
      <button id="player-enable-video" class="button secondary" type="button" hidden>Attiva video</button>
      <p id="player-media-status" role="status" hidden></p>
    </div>
    <div id="player-scores" class="player-scores" hidden></div>
  </main>
</body>
</html>
